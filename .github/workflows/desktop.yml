name: Youthnic Packing Station Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_run:
    workflows: ["Deploy to Cloud Run"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install desktop dependencies
        run: npm ci
      - name: Run desktop durability tests
        run: npm test
      - name: Build installer/package
        run: npm run package
        env:
          # The backend URL is read by the packaged main process at runtime.
          # No database, Firebase service account, or R2 secret is bundled.
          YOUTHNIC_PACKING_API_URL: ${{ vars.YOUTHNIC_PACKING_API_URL }}
      - name: Verify live desktop backend before distributing artifacts
        # Never distribute a desktop client ahead of its server contract.
        run: node ../backend/scripts/verify-desktop-deployment.cjs
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youthnic-packing-station-${{ matrix.platform }}
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

  publish-release:
    name: Publish to GitHub Releases
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all built desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
      - name: Determine Release Tag and Assets
        id: prepare_release
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          mkdir -p dist-assets
          find downloaded-artifacts -type f \( -name "*.exe" -o -name "*.blockmap" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} dist-assets/ \;
          echo "Assets to release:"
          ls -lh dist-assets/
      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.prepare_release.outputs.tag }}
        run: |
          RELEASE_TITLE="Youthnic Packing Station Desktop ${TAG_NAME}"
          cat << 'EOF' > dist-assets/RELEASE_NOTES.md
          ### Youthnic Packing Station Desktop

          Official desktop release for high-durability warehouse packing stations.

          - **Offline-resilient packing sessions**: Local SQLite cache, evidence retention, and offline scan queuing.
          - **Robust video and evidence upload**: Cloudflare R2 direct stream integration with automatic retry.
          - **Full hardware integration**: Barcode scanner, scale, and thermal label printer support.
          - **Windows (x64) and Linux supported**.
          EOF
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading new assets with clobber..."
            gh release upload "$TAG_NAME" dist-assets/* --clobber
          else
            echo "Creating new GitHub Release $TAG_NAME..."
            gh release create "$TAG_NAME" dist-assets/* \
              --title "$RELEASE_TITLE" \
              --notes-file dist-assets/RELEASE_NOTES.md \
              --latest
          fi
