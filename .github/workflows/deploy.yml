# ═══════════════════════════════════════════════════════════════════════════
# GitHub Actions — Consignment Packing → Cloud Run (europe-west1)
#
# quality-gates:
#   - pull_request targeting main (no deploy)
#   - push to main / workflow_dispatch (before deploy)
#
# deploy (push / workflow_dispatch only):
#   1. Build Docker image with frontend Firebase/Supabase config
#   2. Deploy to Cloud Run with env vars from GitHub Secrets (no GCP Secret Manager)
#   3. Verify /api/health and /api/auth/status
#
# Manual branch protection: see docs/BRANCH_PROTECTION.md
# ═══════════════════════════════════════════════════════════════════════════
name: Deploy to Cloud Run

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip Docker build (redeploy existing :latest image only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  # Docker image repo name (independent of Cloud Run service name).
  IMAGE_NAME: consignment-app
  # Default Cloud Run service; workflow also deploys to all known services below.
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'consignment-youthnic-git' }}
  REGION: ${{ vars.CLOUD_RUN_REGION || 'europe-west1' }}

jobs:
  quality-gates:
    name: Lint · Build · Test · Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        env:
          VITE_API_URL: ''
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyTEST_KEY_FOR_CI_BUILD_ONLY' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'example.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'example' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '1234567890' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:1234567890:web:abcdef' }}
        run: npm run build

      - name: Backend tests
        working-directory: backend
        env:
          JWT_SECRET: test-only-jwt-secret-ci-do-not-use-in-production
          NODE_ENV: test
        run: npm test

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Security tests
        env:
          JWT_SECRET: test-only-jwt-secret-ci-do-not-use-in-production
          NODE_ENV: test
        run: npm run test:security

      - name: Backend production dependency audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Build & Deploy
    needs: quality-gates
    # Never deploy from pull_request events
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create frontend .env.production
        env:
          POSTHOG_DASHBOARD_URL: ${{ vars.VITE_POSTHOG_DASHBOARD_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          BETTERSTACK_DASHBOARD_URL: ${{ vars.VITE_BETTERSTACK_DASHBOARD_URL }}
        run: |
          # Do NOT use a YAML-indented heredoc — leading spaces break Vite env parsing.
          {
            echo 'VITE_API_URL='
            echo "VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}"
            echo "VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}"
            echo "VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}"
            echo "VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}"
            echo "VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID}"
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}"
            echo "VITE_POSTHOG_KEY=${VITE_POSTHOG_KEY}"
            echo 'VITE_POSTHOG_HOST=https://us.i.posthog.com'
            echo "VITE_POSTHOG_DASHBOARD_URL=${POSTHOG_DASHBOARD_URL:-https://us.posthog.com/embedded/aUBKw6XLlFMPLf2WJbRbmEzbfSpIyQ}"
            echo "VITE_BETTERSTACK_DASHBOARD_URL=${BETTERSTACK_DASHBOARD_URL:-}"
          } > frontend/.env.production
          if grep -qE '^[[:space:]]+VITE_' frontend/.env.production; then
            echo "::error::frontend/.env.production has leading whitespace — Vite will ignore these keys."
            cat -A frontend/.env.production
            exit 1
          fi
          if ! grep -qE '^VITE_FIREBASE_API_KEY=.{10,}' frontend/.env.production; then
            echo "::error::VITE_FIREBASE_API_KEY is missing or too short in .env.production"
            exit 1
          fi
          echo "✅ frontend/.env.production written ($(wc -l < frontend/.env.production) lines)"

      - name: Validate Firebase frontend secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          missing=()
          for key in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID \
                     VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            val="${!key}"
            if [ -z "$val" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets (Settings → Secrets → Actions):"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo "Login will NOT work until these are set. Get values from Firebase Console → Project settings → Your apps → Web app."
            exit 1
          fi
          echo "✅ All required VITE_FIREBASE_* secrets are present"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Resolve custom domain → Cloud Run service
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'https://consignment.youthnic.shop' }}
        run: |
          DOMAIN_HOST="${CUSTOM_DOMAIN#https://}"
          DOMAIN_HOST="${DOMAIN_HOST%%/*}"
          MAPPED_SERVICE=""
          for gcloud_cmd in "gcloud beta run domain-mappings describe" "gcloud alpha run domain-mappings describe" "gcloud run domain-mappings describe"; do
            if $gcloud_cmd --domain="$DOMAIN_HOST" --region="$REGION" >/dev/null 2>&1; then
              MAPPED_SERVICE=$($gcloud_cmd --domain="$DOMAIN_HOST" --region="$REGION" --format='value(spec.routeName)')
              echo "Resolved via: $gcloud_cmd"
              break
            fi
          done
          if [ -n "$MAPPED_SERVICE" ]; then
            echo "Custom domain $DOMAIN_HOST → Cloud Run service: $MAPPED_SERVICE"
            echo "DOMAIN_MAPPED_SERVICE=$MAPPED_SERVICE" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not read domain mapping for $DOMAIN_HOST — defaulting to consignment-youthnic-git"
            echo "DOMAIN_MAPPED_SERVICE=consignment-youthnic-git" >> "$GITHUB_ENV"
          fi
          # Deploy only the primary / domain-mapped service to avoid paying for two apps.
          echo "DEPLOY_SERVICES=$SERVICE_NAME" >> "$GITHUB_ENV"

      - name: Apply Cloudflare R2 CORS (browser video PUTs)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: consigmentapp
          APP_URL: https://consignment.youthnic.shop
          ALLOWED_ORIGINS: https://consignment.youthnic.shop,http://localhost:5173,http://localhost:5000
        run: |
          cd backend
          npm ci --omit=dev
          node scripts/apply-cors.js

      - name: Configure Docker
        if: github.event.inputs.skip_build != 'true'
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        if: github.event.inputs.skip_build != 'true'
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          POSTHOG_DASHBOARD_URL: ${{ vars.VITE_POSTHOG_DASHBOARD_URL }}
          BETTERSTACK_DASHBOARD_URL: ${{ vars.VITE_BETTERSTACK_DASHBOARD_URL }}
        run: |
          docker build \
            --build-arg VITE_API_URL= \
            --build-arg VITE_FIREBASE_API_KEY="${VITE_FIREBASE_API_KEY}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${VITE_FIREBASE_AUTH_DOMAIN}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${VITE_FIREBASE_PROJECT_ID}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${VITE_FIREBASE_MESSAGING_SENDER_ID}" \
            --build-arg VITE_FIREBASE_APP_ID="${VITE_FIREBASE_APP_ID}" \
            --build-arg VITE_FIREBASE_MEASUREMENT_ID="${VITE_FIREBASE_MEASUREMENT_ID}" \
            --build-arg VITE_SUPABASE_URL="${VITE_SUPABASE_URL}" \
            --build-arg VITE_SUPABASE_ANON_KEY="${VITE_SUPABASE_ANON_KEY}" \
            --build-arg VITE_POSTHOG_KEY="${VITE_POSTHOG_KEY}" \
            --build-arg VITE_POSTHOG_DASHBOARD_URL="${POSTHOG_DASHBOARD_URL:-https://us.posthog.com/embedded/aUBKw6XLlFMPLf2WJbRbmEzbfSpIyQ}" \
            --build-arg VITE_BETTERSTACK_DASHBOARD_URL="${BETTERSTACK_DASHBOARD_URL:-}" \
            -t gcr.io/$PROJECT_ID/$IMAGE_NAME:${{ github.sha }} \
            -t gcr.io/$PROJECT_ID/$IMAGE_NAME:latest \
            .

      - name: Verify Firebase config baked into frontend build
        if: github.event.inputs.skip_build != 'true'
        env:
          EXPECTED_PROJECT: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          docker create --name verify-build "gcr.io/$PROJECT_ID/$IMAGE_NAME:${{ github.sha }}"
          docker cp verify-build:/app/frontend/dist ./dist-verify
          docker rm verify-build
          if [ ! -d ./dist-verify/assets ]; then
            echo "::error::frontend/dist/assets missing from image"
            ls -la ./dist-verify || true
            exit 1
          fi
          # Minifiers may rename exports — search for the baked apiKey / projectId literals.
          if ! grep -rqE 'AIzaSy[A-Za-z0-9_-]{10,}' ./dist-verify/assets/; then
            echo "::error::No Firebase apiKey (AIzaSy…) found in built assets — VITE_FIREBASE_* did not reach Vite."
            ls -la ./dist-verify/assets/ | head -40
            exit 1
          fi
          if [ -n "$EXPECTED_PROJECT" ] && ! grep -rqF "$EXPECTED_PROJECT" ./dist-verify/assets/; then
            echo "::error::Built assets missing projectId $EXPECTED_PROJECT."
            exit 1
          fi
          if grep -rq 'apiKey:void 0' ./dist-verify/assets/; then
            echo "::error::Found apiKey:void 0 — Firebase env was empty at build time."
            exit 1
          fi
          echo "✅ Firebase config verified in frontend build assets"

      - name: Push Docker image
        if: github.event.inputs.skip_build != 'true'
        run: |
          docker push gcr.io/$PROJECT_ID/$IMAGE_NAME:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/$IMAGE_NAME:latest
          DIGEST=$(gcloud container images describe "gcr.io/$PROJECT_ID/$IMAGE_NAME:${{ github.sha }}" --format='get(image_summary.digest)')
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "Pushed image digest: $DIGEST"

      - name: Deploy to Cloud Run
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'https://consignment.youthnic.shop' }}
          POSTHOG_DASHBOARD_URL: ${{ vars.VITE_POSTHOG_DASHBOARD_URL }}
          BETTERSTACK_DASHBOARD_URL: ${{ vars.VITE_BETTERSTACK_DASHBOARD_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          LOGTAIL_SOURCE_TOKEN: ${{ secrets.LOGTAIL_SOURCE_TOKEN }}
          DB_SSL: ${{ vars.DB_SSL || 'true' }}
          # Sensitive values as normal Cloud Run env vars (GitHub Secrets → env; no Secret Manager)
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          BOOTSTRAP_SECRET: ${{ secrets.BOOTSTRAP_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SHARE_LINK_SECRET: ${{ secrets.SHARE_LINK_SECRET }}
          TASKFLOW_ENABLED: ${{ secrets.TASKFLOW_ENABLED }}
          TASKFLOW_SUPABASE_URL: ${{ secrets.TASKFLOW_SUPABASE_URL }}
          TASKFLOW_SERVICE_ROLE_KEY: ${{ secrets.TASKFLOW_SERVICE_ROLE_KEY }}
          TASKFLOW_TEMPLATE_ID: ${{ secrets.TASKFLOW_TEMPLATE_ID }}
          TASKFLOW_RAISED_BY_USER_ID: ${{ secrets.TASKFLOW_RAISED_BY_USER_ID }}
          TASKFLOW_MCP_PAT: ${{ secrets.TASKFLOW_MCP_PAT }}
          TASKFLOW_WEBHOOK_SECRET: ${{ secrets.TASKFLOW_WEBHOOK_SECRET }}
        run: |
          if [ "${{ github.event.inputs.skip_build }}" = "true" ]; then
            export IMAGE_REF="gcr.io/$PROJECT_ID/$IMAGE_NAME:latest"
          else
            export IMAGE_REF="gcr.io/$PROJECT_ID/$IMAGE_NAME@${IMAGE_DIGEST}"
          fi
          chmod +x scripts/gcloud-deploy.sh
          bash scripts/gcloud-deploy.sh

      - name: Verify deployment health
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'https://consignment.youthnic.shop' }}
        run: |
          SERVICE_NAME_CHECK="${PRIMARY_SERVICE:-$DOMAIN_MAPPED_SERVICE}"
          SERVICE_URL="${PRIMARY_URL:-}"
          if [ -z "$SERVICE_URL" ]; then
            SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME_CHECK" --region=$REGION --format='value(status.url)')
          fi
          echo "Primary service: $SERVICE_NAME_CHECK"
          echo "Service URL: $SERVICE_URL"
          echo "::notice::Disable Cloud Run continuous deployment from GitHub. Keep GitHub Actions as the only deploy path."
          HEALTH_OK=0
          for i in $(seq 1 12); do
            CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 25 "${SERVICE_URL}/api/health" || echo "000")
            if [ -f /tmp/health.json ] && grep -q '"status"' /tmp/health.json; then
              echo "Health HTTP $CODE body:"
              cat /tmp/health.json
              DB_STATUS=$(jq -r '.database // "unknown"' /tmp/health.json)
              if [ "$DB_STATUS" = "connected" ]; then
                HEALTH_OK=1
                break
              fi
              if [ "$DB_STATUS" = "unavailable" ] || [ "$DB_STATUS" = "misconfigured" ]; then
                echo "Database status: $DB_STATUS (not ready yet)"
              elif [ "$CODE" = "200" ]; then
                HEALTH_OK=1
                break
              fi
            fi
            echo "Health attempt $i failed (HTTP $CODE) — waiting..."
            sleep 10
          done
          if [ "$HEALTH_OK" != "1" ]; then
            echo "::error::/api/health still failing on ${SERVICE_URL}"
            gcloud run services describe "$SERVICE_NAME_CHECK" --region=$REGION --format='yaml(status)' || true
            gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE_NAME_CHECK}" \
              --project="$PROJECT_ID" --limit=40 --format='value(textPayload)' 2>/dev/null || true
            exit 1
          fi
          curl -fsS --max-time 25 "${SERVICE_URL}/api/auth/status" | tee /tmp/auth-status.json
          echo "Health and auth status checks passed"

          verify_firebase_assets() {
            local base_url="$1"
            local label="$2"
            local html
            if ! html=$(curl -fsS "${base_url}/"); then
              echo "::warning::${label}: could not fetch ${base_url}/"
              return 0
            fi
            local found=""
            for c in $(echo "$html" | grep -oE 'assets/[A-Za-z0-9._-]+\.js' | sort -u); do
              local body
              body=$(curl -fsS "${base_url}/${c}" || true)
              if echo "$body" | grep -qE 'AIzaSy[A-Za-z0-9_-]{10,}'; then
                found="$c"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "::error::${label}: no Firebase apiKey on ${base_url}"
              return 1
            fi
            echo "${label}: ${base_url} -> ${found} (apiKey OK)"
          }

          verify_firebase_assets "${SERVICE_URL}" "Cloud Run"
          verify_firebase_assets "${CUSTOM_DOMAIN}" "Custom domain" || true

      - name: Show service URL
        run: |
          echo "Deployed successfully!"
          echo "Primary service: ${PRIMARY_SERVICE:-$DOMAIN_MAPPED_SERVICE}"
          echo "URL: ${PRIMARY_URL:-}"
          gcloud run services describe "${PRIMARY_SERVICE:-$DOMAIN_MAPPED_SERVICE}" --region=$REGION --format='value(status.url)' || true
