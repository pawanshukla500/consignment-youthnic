# ═══════════════════════════════════════════════════════════════════════════
# GitHub Actions — Consignment Packing → Cloud Run (europe-west1)
#
# On push to main (or manual dispatch):
#   1. Sync GitHub Secrets → GCP Secret Manager
#   2. Build Docker image with frontend Firebase/Supabase config
#   3. Deploy to Cloud Run with all env vars + mounted secrets
#   4. Verify /api/health and /api/auth/status
# ═══════════════════════════════════════════════════════════════════════════
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip Docker build (redeploy existing :latest image only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  # Docker image repo name (independent of Cloud Run service name).
  IMAGE_NAME: consignment-app
  # Default Cloud Run service; workflow also deploys to all known services below.
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'consignment-youthnic-git' }}
  REGION: ${{ vars.CLOUD_RUN_REGION || 'europe-west1' }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create frontend .env.production
        env:
          POSTHOG_DASHBOARD_URL: ${{ vars.VITE_POSTHOG_DASHBOARD_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          BETTERSTACK_DASHBOARD_URL: ${{ vars.VITE_BETTERSTACK_DASHBOARD_URL }}
        run: |
          # Do NOT use a YAML-indented heredoc — leading spaces break Vite env parsing.
          {
            echo 'VITE_API_URL='
            echo "VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}"
            echo "VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}"
            echo "VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}"
            echo "VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}"
            echo "VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID}"
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}"
            echo "VITE_POSTHOG_KEY=${VITE_POSTHOG_KEY}"
            echo 'VITE_POSTHOG_HOST=https://us.i.posthog.com'
            echo "VITE_POSTHOG_DASHBOARD_URL=${POSTHOG_DASHBOARD_URL:-https://us.posthog.com/embedded/aUBKw6XLlFMPLf2WJbRbmEzbfSpIyQ}"
            echo "VITE_BETTERSTACK_DASHBOARD_URL=${BETTERSTACK_DASHBOARD_URL:-}"
          } > frontend/.env.production
          if grep -qE '^[[:space:]]+VITE_' frontend/.env.production; then
            echo "::error::frontend/.env.production has leading whitespace — Vite will ignore these keys."
            cat -A frontend/.env.production
            exit 1
          fi
          if ! grep -qE '^VITE_FIREBASE_API_KEY=.{10,}' frontend/.env.production; then
            echo "::error::VITE_FIREBASE_API_KEY is missing or too short in .env.production"
            exit 1
          fi
          echo "✅ frontend/.env.production written ($(wc -l < frontend/.env.production) lines)"

      - name: Validate Firebase frontend secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          missing=()
          for key in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID \
                     VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            val="${!key}"
            if [ -z "$val" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets (Settings → Secrets → Actions):"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo "Login will NOT work until these are set. Get values from Firebase Console → Project settings → Your apps → Web app."
            exit 1
          fi
          echo "✅ All required VITE_FIREBASE_* secrets are present"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Resolve custom domain → Cloud Run service
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'https://consignment.youthnic.shop' }}
        run: |
          DOMAIN_HOST="${CUSTOM_DOMAIN#https://}"
          DOMAIN_HOST="${DOMAIN_HOST%%/*}"
          MAPPED_SERVICE=""
          for gcloud_cmd in "gcloud beta run domain-mappings describe" "gcloud alpha run domain-mappings describe" "gcloud run domain-mappings describe"; do
            if $gcloud_cmd --domain="$DOMAIN_HOST" --region="$REGION" >/dev/null 2>&1; then
              MAPPED_SERVICE=$($gcloud_cmd --domain="$DOMAIN_HOST" --region="$REGION" --format='value(spec.routeName)')
              echo "Resolved via: $gcloud_cmd"
              break
            fi
          done
          if [ -n "$MAPPED_SERVICE" ]; then
            echo "Custom domain $DOMAIN_HOST → Cloud Run service: $MAPPED_SERVICE"
            echo "DOMAIN_MAPPED_SERVICE=$MAPPED_SERVICE" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not read domain mapping for $DOMAIN_HOST — defaulting to consignment-youthnic-git"
            echo "DOMAIN_MAPPED_SERVICE=consignment-youthnic-git" >> "$GITHUB_ENV"
          fi
          # Deploy only the primary / domain-mapped service to avoid paying for two apps.
          echo "DEPLOY_SERVICES=$SERVICE_NAME" >> "$GITHUB_ENV"

      - name: Sync secrets to GCP Secret Manager
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          BOOTSTRAP_SECRET: ${{ secrets.BOOTSTRAP_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SHARE_LINK_SECRET: ${{ secrets.SHARE_LINK_SECRET }}
        run: bash scripts/sync-secrets-to-gcp.sh

      - name: Configure Docker
        if: github.event.inputs.skip_build != 'true'
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        if: github.event.inputs.skip_build != 'true'
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          POSTHOG_DASHBOARD_URL: ${{ vars.VITE_POSTHOG_DASHBOARD_URL }}
          BETTERSTACK_DASHBOARD_URL: ${{ vars.VITE_BETTERSTACK_DASHBOARD_URL }}
        run: |
          docker build \
            --build-arg VITE_API_URL= \
            --build-arg VITE_FIREBASE_API_KEY="${VITE_FIREBASE_API_KEY}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${VITE_FIREBASE_AUTH_DOMAIN}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${VITE_FIREBASE_PROJECT_ID}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${VITE_FIREBASE_MESSAGING_SENDER_ID}" \
            --build-arg VITE_FIREBASE_APP_ID="${VITE_FIREBASE_APP_ID}" \
            --build-arg VITE_FIREBASE_MEASUREMENT_ID="${VITE_FIREBASE_MEASUREMENT_ID}" \
            --build-arg VITE_SUPABASE_URL="${VITE_SUPABASE_URL}" \
            --build-arg VITE_SUPABASE_ANON_KEY="${VITE_SUPABASE_ANON_KEY}" \
            --build-arg VITE_POSTHOG_KEY="${VITE_POSTHOG_KEY}" \
            --build-arg VITE_POSTHOG_DASHBOARD_URL="${POSTHOG_DASHBOARD_URL:-https://us.posthog.com/embedded/aUBKw6XLlFMPLf2WJbRbmEzbfSpIyQ}" \
            --build-arg VITE_BETTERSTACK_DASHBOARD_URL="${BETTERSTACK_DASHBOARD_URL:-}" \
            -t gcr.io/$PROJECT_ID/$IMAGE_NAME:${{ github.sha }} \
            -t gcr.io/$PROJECT_ID/$IMAGE_NAME:latest \
            .

      - name: Verify Firebase config baked into frontend build
        if: github.event.inputs.skip_build != 'true'
        env:
          EXPECTED_PROJECT: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          docker create --name verify-build "gcr.io/$PROJECT_ID/$IMAGE_NAME:${{ github.sha }}"
          docker cp verify-build:/app/frontend/dist ./dist-verify
          docker rm verify-build
          if [ ! -d ./dist-verify/assets ]; then
            echo "::error::frontend/dist/assets missing from image"
            ls -la ./dist-verify || true
            exit 1
          fi
          # Minifiers may rename exports — search for the baked apiKey / projectId literals.
          if ! grep -rqE 'AIzaSy[A-Za-z0-9_-]{10,}' ./dist-verify/assets/; then
            echo "::error::No Firebase apiKey (AIzaSy…) found in built assets — VITE_FIREBASE_* did not reach Vite."
            ls -la ./dist-verify/assets/ | head -40
            exit 1
          fi
          if [ -n "$EXPECTED_PROJECT" ] && ! grep -rqF "$EXPECTED_PROJECT" ./dist-verify/assets/; then
            echo "::error::Built assets missing projectId $EXPECTED_PROJECT."
            exit 1
          fi
          if grep -rq 'apiKey:void 0' ./dist-verify/assets/; then
            echo "::error::Found apiKey:void 0 — Firebase env was empty at build time."
            exit 1
          fi
          echo "✅ Firebase config verified in frontend build assets"

      - name: Push Docker image
        if: github.event.inputs.skip_build != 'true'
        run: |
          docker push gcr.io/$PROJECT_ID/$IMAGE_NAME:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/$IMAGE_NAME:latest
          DIGEST=$(gcloud container images describe "gcr.io/$PROJECT_ID/$IMAGE_NAME:${{ github.sha }}" --format='get(image_summary.digest)')
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "Pushed image digest: $DIGEST"

      - name: Deploy to Cloud Run
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'https://consignment.youthnic.shop' }}
          POSTHOG_DASHBOARD_URL: ${{ vars.VITE_POSTHOG_DASHBOARD_URL }}
          BETTERSTACK_DASHBOARD_URL: ${{ vars.VITE_BETTERSTACK_DASHBOARD_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ "${{ github.event.inputs.skip_build }}" = "true" ]; then
            IMAGE_REF="gcr.io/$PROJECT_ID/$IMAGE_NAME:latest"
          else
            IMAGE_REF="gcr.io/$PROJECT_ID/$IMAGE_NAME@${IMAGE_DIGEST}"
          fi
          echo "Image: $IMAGE_REF"

          # Fail fast if DATABASE_URL is a LAN/private address — Cloud Run cannot reach it (causes 503).
          if gcloud secrets describe DATABASE_URL >/dev/null 2>&1; then
            DB_URL=$(gcloud secrets versions access latest --secret=DATABASE_URL)
            DB_HOST=$(DB_URL="$DB_URL" python3 - <<'PY'
import os, urllib.parse
u = os.environ.get("DB_URL", "")
try:
    print(urllib.parse.urlparse(u).hostname or "")
except Exception:
    print("")
PY
)
            echo "DATABASE_URL host: ${DB_HOST:-unknown}"
            case "$DB_HOST" in
              localhost|127.0.0.1|::1|0.0.0.0|"")
                echo "::error::DATABASE_URL host is local/empty ($DB_HOST). Cloud Run needs a public Postgres (Cloud SQL / hosted). Update GitHub secret DATABASE_URL."
                exit 1
                ;;
            esac
            if echo "$DB_HOST" | grep -Eq '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)'; then
              echo "::error::DATABASE_URL points at private LAN IP ($DB_HOST). Cloud Run cannot reach your office/home Postgres — that is why /api/health returns 503."
              echo "::error::Put a cloud Postgres URL in GitHub → Settings → Secrets → DATABASE_URL (Cloud SQL or other hosted Postgres), then re-run."
              exit 1
            fi
          else
            echo "::error::Secret DATABASE_URL missing in Secret Manager"
            exit 1
          fi

          SECRET_CSV=""
          for pair in \
            "JWT_SECRET=JWT_SECRET:latest" \
            "MAILGUN_API_KEY=MAILGUN_API_KEY:latest" \
            "MAILGUN_DOMAIN=MAILGUN_DOMAIN:latest" \
            "DATABASE_URL=DATABASE_URL:latest" \
            "SUPABASE_JWT_SECRET=SUPABASE_JWT_SECRET:latest" \
            "FIREBASE_SERVICE_ACCOUNT_JSON=FIREBASE_SERVICE_ACCOUNT_JSON:latest" \
            "R2_ACCOUNT_ID=R2_ACCOUNT_ID:latest" \
            "R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest" \
            "R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest" \
            "SHARE_LINK_SECRET=SHARE_LINK_SECRET:latest" \
            "BOOTSTRAP_SECRET=BOOTSTRAP_SECRET:latest"; do
            name="${pair%%=*}"
            if gcloud secrets describe "$name" >/dev/null 2>&1; then
              if [ -n "$SECRET_CSV" ]; then SECRET_CSV="${SECRET_CSV},"; fi
              SECRET_CSV="${SECRET_CSV}${pair}"
              echo "Mounting secret: $name"
            else
              echo "Skipping secret (not in Secret Manager): $name"
            fi
          done

          DEPLOY_TARGETS="$DOMAIN_MAPPED_SERVICE $DEPLOY_SERVICES $SERVICE_NAME"
          DEPLOYED_SVCS=""
          ALL_ORIGINS="${CUSTOM_DOMAIN}"
          for candidate in $DEPLOY_TARGETS; do
            [ -n "$candidate" ] || continue
            if gcloud run services describe "$candidate" --region="$REGION" >/dev/null 2>&1; then
              url=$(gcloud run services describe "$candidate" --region="$REGION" --format='value(status.url)')
              if [ -n "$url" ] && ! echo ",$ALL_ORIGINS," | grep -q ",$url,"; then
                ALL_ORIGINS="${ALL_ORIGINS},${url}"
              fi
            fi
          done
          echo "ALLOWED_ORIGINS for all services: $ALL_ORIGINS"

          for svc in $DEPLOY_TARGETS; do
            [ -n "$svc" ] || continue
            if echo " $DEPLOYED_SVCS " | grep -q " ${svc} "; then
              continue
            fi
            echo "Deploying to Cloud Run service: $svc (region: $REGION)"

            # Cost profile: min=0, max=3, 1 vCPU / 1Gi
            # Do NOT mix --set-env-vars with --remove-env-vars (gcloud rejects).
            # Prefer --update-env-vars so existing secret mounts are preserved.
            ENV_CSV="NODE_ENV=production"
            ENV_CSV="${ENV_CSV}##ADMIN_EMAIL=returnorders@vbexports.co.in"
            ENV_CSV="${ENV_CSV}##FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}"
            ENV_CSV="${ENV_CSV}##FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}"
            ENV_CSV="${ENV_CSV}##R2_BUCKET=consigmentapp"
            ENV_CSV="${ENV_CSV}##DB_USE_POSTGRES=true"
            ENV_CSV="${ENV_CSV}##DB_SSL=true"
            ENV_CSV="${ENV_CSV}##DB_POOL_MAX=10"
            ENV_CSV="${ENV_CSV}##SUPABASE_URL=${SUPABASE_URL}"
            ENV_CSV="${ENV_CSV}##SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            ENV_CSV="${ENV_CSV}##MAIL_FROM_EMAIL=consignment@youthnic.shop"
            ENV_CSV="${ENV_CSV}##MAIL_FROM_NAME=Youthnic Packing Station"
            ENV_CSV="${ENV_CSV}##MAIL_USER_DOMAIN=youthnic.shop"
            ENV_CSV="${ENV_CSV}##APP_URL=${CUSTOM_DOMAIN}"
            ENV_CSV="${ENV_CSV}##ALLOWED_ORIGINS=${ALL_ORIGINS}"
            ENV_CSV="${ENV_CSV}##LOGTAIL_INGEST_HOST=s2531760.eu-fsn-3.betterstackdata.com"
            ENV_CSV="${ENV_CSV}##POSTHOG_DASHBOARD_URL=${POSTHOG_DASHBOARD_URL:-https://us.posthog.com/embedded/aUBKw6XLlFMPLf2WJbRbmEzbfSpIyQ}"
            if [ -n "${BETTERSTACK_DASHBOARD_URL:-}" ]; then
              ENV_CSV="${ENV_CSV}##BETTERSTACK_DASHBOARD_URL=${BETTERSTACK_DASHBOARD_URL}"
            fi
            if [ -n "${{ secrets.LOGTAIL_SOURCE_TOKEN }}" ]; then
              ENV_CSV="${ENV_CSV}##LOGTAIL_SOURCE_TOKEN=${{ secrets.LOGTAIL_SOURCE_TOKEN }}"
            fi

            gcloud run deploy "$svc" \
              --image="$IMAGE_REF" \
              --platform=managed \
              --region=$REGION \
              --allow-unauthenticated \
              --port=8080 \
              --memory=1Gi \
              --cpu=1 \
              --concurrency=80 \
              --timeout=300 \
              --min-instances=0 \
              --max-instances=3 \
              --cpu-throttling \
              --execution-environment=gen2 \
              --quiet \
              --update-env-vars="^##^${ENV_CSV}" \
              --update-secrets="$SECRET_CSV"

            gcloud run services update "$svc" \
              --region=$REGION \
              --remove-env-vars="ADMIN_PASSWORD" \
              --quiet || true

            gcloud run services update-traffic "$svc" \
              --region=$REGION \
              --to-latest \
              --quiet || true

            DEPLOYED_URL=$(gcloud run services describe "$svc" --region=$REGION --format='value(status.url)')
            echo "Deployed $svc → $DEPLOYED_URL"
            DEPLOYED_SVCS="${DEPLOYED_SVCS} ${svc}"
            PRIMARY_SERVICE="$svc"
            PRIMARY_URL="$DEPLOYED_URL"
          done

          if [ -z "${PRIMARY_SERVICE:-}" ]; then
            echo "::error::No Cloud Run service was deployed."
            exit 1
          fi
          echo "PRIMARY_SERVICE=$PRIMARY_SERVICE" >> "$GITHUB_ENV"
          echo "PRIMARY_URL=$PRIMARY_URL" >> "$GITHUB_ENV"

          for extra in consignment-pack consignment-packing; do
            if echo " $DEPLOYED_SVCS " | grep -q " ${extra} "; then
              continue
            fi
            if gcloud run services describe "$extra" --region="$REGION" >/dev/null 2>&1; then
              echo "Cost-cap legacy service $extra → min=0, max=1, 512Mi, 1 CPU"
              gcloud run services update "$extra" \
                --region="$REGION" \
                --min-instances=0 \
                --max-instances=1 \
                --cpu=1 \
                --memory=512Mi \
                --cpu-throttling \
                --quiet || true
            fi
          done

      - name: Verify deployment health
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'https://consignment.youthnic.shop' }}
        run: |
          SERVICE_NAME_CHECK="${PRIMARY_SERVICE:-$DOMAIN_MAPPED_SERVICE}"
          SERVICE_URL="${PRIMARY_URL:-}"
          if [ -z "$SERVICE_URL" ]; then
            SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME_CHECK" --region=$REGION --format='value(status.url)')
          fi
          echo "Primary service: $SERVICE_NAME_CHECK"
          echo "Service URL: $SERVICE_URL"
          echo "::notice::Use GitHub Actions as the ONLY deploy path. Disable Cloud Run 'continuous deployment from GitHub' (Edit repo settings) — CD builds without JWT/DB secrets and causes 503."
          # Cold start + possible CD race: retry longer, then dump logs.
          HEALTH_OK=0
          for i in $(seq 1 12); do
            if curl -fsS --max-time 25 "${SERVICE_URL}/api/health" -o /tmp/health.json; then
              HEALTH_OK=1
              break
            fi
            echo "Health attempt $i failed — waiting..."
            sleep 10
          done
          if [ "$HEALTH_OK" != "1" ]; then
            echo "::error::/api/health still failing on ${SERVICE_URL}"
            gcloud run services describe "$SERVICE_NAME_CHECK" --region=$REGION --format='yaml(status)' || true
            gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE_NAME_CHECK}" \
              --region=$REGION --limit=40 --format='value(textPayload)' 2>/dev/null || true
            exit 1
          fi
          cat /tmp/health.json
          DB_STATUS=$(jq -r '.database // "unknown"' /tmp/health.json)
          echo "Database status: $DB_STATUS"
          if [ "$DB_STATUS" = "misconfigured" ] || [ "$DB_STATUS" = "unavailable" ]; then
            echo "::warning::PostgreSQL is not healthy. Check DATABASE_URL GitHub secret and Secret Manager."
          fi
          curl -fsS --max-time 25 "${SERVICE_URL}/api/auth/status" | tee /tmp/auth-status.json
          echo "✅ Health and auth status checks passed"

          # Verify served assets include a real Firebase apiKey (minifiers rename exports).
          verify_firebase_assets() {
            local base_url="$1"
            local label="$2"
            local html
            if ! html=$(curl -fsS "${base_url}/"); then
              echo "::warning::${label}: could not fetch ${base_url}/ (domain mapping may be pending)"
              return 0
            fi
            local found=""
            for c in $(echo "$html" | grep -oE 'assets/[A-Za-z0-9._-]+\.js' | sort -u); do
              local body
              body=$(curl -fsS "${base_url}/${c}" || true)
              if echo "$body" | grep -qE 'AIzaSy[A-Za-z0-9_-]{10,}'; then
                found="$c"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "::error::${label}: no Firebase apiKey (AIzaSy…) on ${base_url}"
              return 1
            fi
            echo "✅ ${label}: ${base_url} → ${found} (apiKey OK)"
          }

          verify_firebase_assets "${SERVICE_URL}" "Cloud Run"
          verify_firebase_assets "${CUSTOM_DOMAIN}" "Custom domain" || true

      - name: Show service URL
        run: |
          echo "✅ Deployed successfully!"
          echo "Primary service: ${PRIMARY_SERVICE:-$DOMAIN_MAPPED_SERVICE}"
          echo "URL: ${PRIMARY_URL:-}"
          gcloud run services describe "${PRIMARY_SERVICE:-$DOMAIN_MAPPED_SERVICE}" --region=$REGION --format='value(status.url)' || true
